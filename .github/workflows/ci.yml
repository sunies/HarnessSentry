name: Community CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-self-test:
    name: Build and self-test (macOS)
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          swift --version

      - name: Build products
        run: |
          swift build --product HarnessSentry
          swift build --product HarnessSentryHook

      - name: Run self-test
        run: swift run HarnessSentrySelfTest

      - name: Assemble Community app
        run: Scripts/build-app.sh release

      - name: Verify app structure and ad-hoc signature
        run: |
          test -x dist/HarnessSentry.app/Contents/MacOS/HarnessSentry
          test -x dist/HarnessSentry.app/Contents/MacOS/HarnessSentryHook
          plutil -lint dist/HarnessSentry.app/Contents/Info.plist
          codesign --verify --deep --strict dist/HarnessSentry.app

      - name: Upload ad-hoc development bundle
        uses: actions/upload-artifact@v4
        with:
          name: HarnessSentry-community-${{ runner.arch }}
          path: dist/HarnessSentry.app
          if-no-files-found: error
          retention-days: 7
